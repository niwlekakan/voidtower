name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-26
        with:
          components: rustfmt
      - name: Test deterministic repository truth
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_repo_truth.py -v
      - name: Test repository prerequisite contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts.test_repository_prerequisites -v
      - name: Check durable action schema catalog drift
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts.test_action_schema_catalog -v
      - name: Check generated API/OpenAPI contract drift
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts.test_api_contract_drift -v
      - name: Test agent upgrade/rollback behaviour
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts.test_agent_rollback -v
      - name: Derive credential-safe repository truth
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/repo_truth.py --repo . --json --check --base "$BASE_COMMIT" --head "$HEAD_COMMIT"
      - name: Test compatibility mutation inventory fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts.test_compatibility_mutation_inventory -v
      - name: Reject internal, sensitive, and generated tracked files
        run: bash scripts/check-repository-hygiene.sh
      - name: Reject unprotected push approval context
        if: github.event_name == 'push' && !github.ref_protected
        run: >-
          echo 'Compatibility mutation approval requires a pull-request base or a protected branch push.'
          && exit 1
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check generated API contract drift (byte-exact)
        run: npm run contracts:check
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (clippy + test)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-26
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - name: Numbered migration foundation
        working-directory: backend
        run: cargo test db::tests
      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: backend
        run: cargo test --all-features

  supply-chain:
    name: Supply chain (cargo-deny + cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      # cargo-audit is installed with `cargo install` (not the rustsec/audit-check
      # action) because this repo's crate lives in `backend/`, not the repo root
      # (no root Cargo.toml/Cargo.lock) — invoking cargo directly with
      # `working-directory: backend` matches how the `backend` job above already
      # runs clippy/test against this non-root layout, instead of depending on a
      # marketplace action's assumptions about where the lockfile lives.
      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny@0.20.2 cargo-audit
      - name: cargo deny check
        working-directory: backend
        run: cargo deny check
      # The only retained exceptions are RUSTSEC-2023-0071 (rsa 0.9.10; the latest
      # openidconnect release has no version compatible with fixed rsa 0.10) and
      # RUSTSEC-2026-0543 (chrono 0.4.45, unmaintained, no patched versions).
      # Both are reached through openidconnect. Mirrors backend/deny.toml; see
      # docs/lane-notes/M1.md. Do not add other ignores to bypass a failure.
      - name: cargo audit
        working-directory: backend
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0543

  mutation-testing:
    name: Mutation testing (policy + voidwatch)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      # Scoped to the security boundary only (ADR-005 constraint 3 / gap-analysis P1
      # row 1) — not the whole crate, which would be prohibitively slow. Runs on
      # every push/PR to main rather than path-filtering to just these files: with
      # only 6 files and 63 mutants the fixed cost is minutes, not an amount worth
      # the extra complexity/brittleness of a job-level paths-filter step (workflow-
      # level `on.pull_request.paths` isn't an option here since it would gate the
      # `frontend`/`backend` jobs too, which ADR-005 constraint 1 forbids touching).
      - name: cargo mutants (policy.rs + voidwatch/**)
        working-directory: backend
        run: cargo mutants --in-place --no-shuffle --all-features --file src/policy.rs --file 'src/voidwatch/**/*.rs'

  golden-path:
    name: Golden path (Docker + App Vault + restic)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - name: Install restic
        run: |
          sudo apt-get update
          sudo apt-get install --yes restic
      - name: Verify integration dependencies
        run: |
          docker info
          docker compose version
          restic version
      - name: Build VoidTower
        working-directory: backend
        run: cargo build --bin voidtower
      - name: Run real-infrastructure golden paths
        working-directory: backend
        shell: bash
        run: |
          restic_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          trap 'unset restic_password' EXIT
          echo "::add-mask::$restic_password"
          RESTIC_PASSWORD="$restic_password" cargo run --example golden_path
          unset restic_password
          trap - EXIT

  release-gates:
    name: Source-owned release gate parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-26
        with:
          components: clippy, rustfmt
      - name: Stage node and npm in a gate-trusted path
        # The gate trusts a tool only when every ancestor is root- or self-owned and
        # not group/world writable. On these runners both /opt/hostedtoolcache and
        # /usr/local/bin are group-writable, so setup-node's node and npm are
        # rejected and the frontend gates die with "gate executable or command was
        # unavailable". Stage a root-owned copy at /usr/local/lib/node, whose
        # ancestry is secure, and put its bin directory on PATH. The directory must
        # be named after a toolchain marker ("node") for the gate to accept it.
        run: |
          NODE_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          sudo rm -rf /usr/local/lib/node
          sudo cp -a "$NODE_ROOT" /usr/local/lib/node
          sudo chown -R root:root /usr/local/lib/node
          sudo chmod -R go-w /usr/local/lib/node
          echo "/usr/local/lib/node/bin" >> "$GITHUB_PATH"
          /usr/local/lib/node/bin/node --version
          /usr/local/lib/node/bin/npm --version
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install standalone MCP dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement odysseus-mcp-servers/requirements.txt
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Prefetch the dependency closure
        # The gates run with CARGO_NET_OFFLINE=true against a private Cargo home
        # populated from this runner's cache. The tree pins one git dependency
        # (openidconnect), which only lands in that cache after a fetch.
        run: cargo fetch --manifest-path backend/Cargo.toml
      - name: Prefetch the advisory databases
        # cargo-deny keeps its advisory database under CARGO_HOME/advisory-dbs and
        # only creates it when it runs with network access. On a fresh runner that
        # directory does not exist yet, so the offline gate has nothing to read and
        # fails before checking anything. Populate it here; whether this preflight
        # passes is irrelevant, the gate re-checks everything.
        continue-on-error: true
        working-directory: backend
        run: cargo deny check advisories
      - name: Report selected gate tools
        # A missing tool inside the sandbox surfaces 15 minutes later as exit 125
        # with "gate executable or command was unavailable". Print the selection
        # up front so the cause is visible in the first minute.
        run: |
          python3 - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path

          sys.path.insert(0, ".")
          sys.path.insert(0, "scripts")
          from scripts.release_gate import selected_tool_executables

          selected = selected_tool_executables(Path(".").resolve())
          print("selected:", json.dumps({k: str(v.path) for k, v in sorted(selected.items())}, indent=2))
          print("which npm:", shutil.which("npm"))
          print("which node:", shutil.which("node"))
          print("PATH:", os.environ.get("PATH", ""))
          from scripts.release_gate import SAFE_TOOL_DIRECTORIES, TOOLCHAIN_MARKERS, secure_path

          root = Path(".").resolve()
          for name in ("npm", "node"):
              for entry in dict.fromkeys(os.environ.get("PATH", "").split(os.pathsep)):
                  if not entry:
                      continue
                  candidate = Path(entry) / name
                  if not candidate.exists():
                      continue
                  try:
                      resolved = Path(os.path.abspath(candidate)).resolve(strict=True)
                  except OSError as exc:
                      print(f"{name}: {candidate} resolve failed: {exc}")
                      continue
                  print(
                      f"{name}: {candidate}"
                      f" file={candidate.is_file()}"
                      f" x={os.access(candidate, os.X_OK)}"
                      f" secure_file={secure_path(candidate, root)}"
                      f" lexical_dir_symlink={candidate.parent.is_symlink()}"
                      f" secure_lexical_dir={secure_path(candidate.parent, root)}"
                      f" secure_resolved_dir={secure_path(resolved.parent, root)}"
                      f" safe_dir={candidate.parent in SAFE_TOOL_DIRECTORIES}"
                      f" marker={candidate.parent.name == 'bin' and any(m in candidate.parent.parts for m in TOOLCHAIN_MARKERS)}"
                      f" resolved={resolved}"
                  )
          missing = [name for name in ("node", "npm") if name not in selected]
          if missing:
              raise SystemExit(f"gate tool selection is missing: {', '.join(missing)}")
          PY
      - name: Run the source-owned all-scope release gates
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release_gate.py
          --repo .
          --manifest scripts/release-gates.json
          --scope all
          --require-clean
          --json
          --output dev-data/release-gate-ci.json
