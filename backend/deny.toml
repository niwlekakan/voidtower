# cargo-deny configuration (P1-05, ADR-005). Run: `cd backend && cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/
#
# Baseline policy: catch new supply-chain problems going forward. Pre-existing
# advisories already present in the current dependency tree are ignored below
# by ID, each with a reason, rather than silently retroactively failing CI on
# day one — see the `[advisories.ignore]` comment for why none of these are
# fixed by a version bump in this task.

[graph]
all-features = false

[output]
feature-depth = 1

# This section is considered when running `cargo deny check advisories`.
[advisories]
# Narrow exceptions for residual advisories with no safe compatible upstream fix.
# Recheck each entry after dependency updates and remove it once resolved.
# Any advisory not listed here still fails the check; this is not a blanket exemption.
ignore = [
    # Both residual advisories are reached only through the git-pinned
    # openidconnect 4.1.0 (ramosbugs/openidconnect-rs @ e20ddbb0), which
    # upstream has not released past. Tracking: docs/lane-notes/M1.md.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 (Marvin Attack); no fixed 0.9.x release, 0.10.0 needs a newer openidconnect than the pinned upstream commit. Tracking: docs/lane-notes/M1.md" },
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 flagged unmaintained; latest release, no maintained replacement in the openidconnect dependency path. Tracking: docs/lane-notes/M1.md" },
]

# This section is considered when running `cargo deny check licenses`.
[licenses]
# The license set this crate's dependency tree actually uses today (verified
# via `cargo deny check licenses` against the current Cargo.lock), plus this
# crate's own AGPL-3.0-or-later. Adding a dependency under a license not in
# this list is a deliberate, reviewable change to this file, not silent drift.
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib", # permissive license for the pure-Rust zlib-rs deflate backend
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

# This section is considered when running `cargo deny check bans`.
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# This section is considered when running `cargo deny check sources`.
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/ramosbugs/openidconnect-rs"] # Cargo.lock pins the exact audited upstream commit.
